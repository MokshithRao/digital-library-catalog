{% extends "base.html" %}

{% block title %}Home | Digital Library Catalog{% endblock %}

{% block content %}
    <h2>Welcome to Digital Library Catalog</h2>
    <p>Explore books, authors, and genres.</p>
    <h3>Explore Genres</h3>
    
    <ul>
        {% for genre in genres %}
            <li>
                <a href="{{ url_for('genre_books', genre_id=genre.id) }}">
                    {{ genre.name }}
                </a>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
